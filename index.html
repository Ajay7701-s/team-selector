<!DOCTYPE html>
<html>
<head>
<title>Team Assignment</title>

<style>

body{
font-family: Arial, sans-serif;
text-align:center;
background:#f4f6f8;
margin-top:150px;
}

button{
padding:20px 40px;
font-size:20px;
border:none;
border-radius:10px;
background:#333;
color:white;
cursor:pointer;
}

button:hover{
background:#555;
}

</style>

</head>

<body>

<h1>Click to Get Your Team</h1>

<button onclick="assignTeam()">Get My Team</button>

<h2 id="result"></h2>

<script>

let teams = [
"A","A","A","A","A","A",
"B","B","B","B","B","B",
"C","C","C","C","C","C"
];

function assignTeam(){

let name = prompt("Enter your name");

if(!name){
alert("Please enter your name");
return;
}

if(teams.length === 0){
document.getElementById("result").innerText="All teams are full";
return;
}

let randomIndex = Math.floor(Math.random()*teams.length);
let team = teams[randomIndex];

teams.splice(randomIndex,1);

document.getElementById("result").innerText =
"You are in TEAM " + team + " 🎉";

fetch("https://script.google.com/macros/s/AKfycbxgNXq1t0c4bOf2GWpWzksLzY5o-qTojEGOE1WmXKq_e-uobqAnQx5gr1Yyw7FN6qqT/exec",{
method:"POST",
mode:"no-cors",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:name,
team:"TEAM "+team
})
});

}

</script>

</body>
</html>
