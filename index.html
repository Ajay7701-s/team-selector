<!DOCTYPE html>
<html>
<head>
<title>Team Assignment</title>

<style>
body{
font-family: Arial;
text-align:center;
background:#f4f6f8;
margin-top:150px;
}

button{
padding:20px 40px;
font-size:20px;
border:none;
border-radius:12px;
background:#333;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<h1>Click to Get Your Team</h1>

<button onclick="assignTeam()">Get My Team</button>

<h2 id="result"></h2>

<script>

let teams = [
"A","A","A","A","A","A",
"B","B","B","B","B","B",
"C","C","C","C","C","C"
];

function assignTeam(){

if(teams.length === 0){
document.getElementById("result").innerText="All teams are full";
return;
}

let randomIndex = Math.floor(Math.random()*teams.length);

let team = teams[randomIndex];

teams.splice(randomIndex,1);

document.getElementById("result").innerText="You are in TEAM "+team+" 🎉";

}

</script>

</body>
</html>
