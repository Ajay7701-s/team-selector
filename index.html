<!DOCTYPE html>
<html>
<head>
<title>Team Selection</title>
<style>
body{
font-family: Arial;
text-align:center;
background:#f4f6f8;
margin-top:120px;
}

h1{
margin-bottom:40px;
}

button{
padding:20px 40px;
font-size:20px;
margin:20px;
border:none;
border-radius:12px;
cursor:pointer;
}

.teamA{background:#4CAF50;color:white;}
.teamB{background:#2196F3;color:white;}
.teamC{background:#ff9800;color:white;}
</style>
</head>

<body>

<h1>Select Your Team</h1>

<button class="teamA" onclick="team('A')">TEAM A</button>
<button class="teamB" onclick="team('B')">TEAM B</button>
<button class="teamC" onclick="team('C')">TEAM C</button>

<script>
function team(t){
document.body.innerHTML="<h1>You joined TEAM "+t+" 🎉</h1>";
}
</script>

</body>
</html>
